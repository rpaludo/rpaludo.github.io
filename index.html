<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechPain Control Center</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary: #007bff;
            --success: #28a745;
            --warning: #ffc107;
            --danger: #dc3545;
            --text: #ffffff;
            --text-dim: #b0b0b0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            margin-bottom: 10px;
        }

        .btn:active { transform: scale(0.98); }
        .btn-primary { background-color: var(--primary); color: white; }
        .btn-success { background-color: var(--success); color: white; }
        .btn-danger { background-color: var(--danger); color: white; }
        .btn-warning { background-color: var(--warning); color: black; }

        .display-main {
            font-size: 3.5rem;
            color: #00ff00;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            margin: 10px 0;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }

        .label {
            color: var(--text-dim);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: block;
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .badge-off { background-color: #444; color: #ccc; }
        .badge-on { background-color: var(--success); color: white; box-shadow: 0 0 10px var(--success); }

        .time-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 15px;
        }

        .time-box {
            background: rgba(255,255,255,0.05);
            padding: 12px;
            border-radius: 10px;
            text-align: center;
        }

        .time-value { font-size: 1.4rem; font-weight: bold; color: #00d4ff; }

        .input-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        input[type="number"] {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #121212;
            color: white;
            font-size: 16px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Card de Conexão -->
        <button class="btn btn-primary" id="connectBtn" onclick="connectBLE()">CONECTAR DISPOSITIVO</button>

        <!-- Card de Display Principal -->
        <div class="card">
            <div class="status-header">
                <span class="label">Status do Equipamento</span>
                <span id="st-badge" class="badge badge-off">DESCONECTADO</span>
            </div>
            
            <span class="label">Corrente Ajustada</span>
            <div id="disp-i-set" class="display-main">0.0<small style="font-size: 1.5rem">mA</small></div>

            <div class="time-row">
                <div class="time-box">
                    <span class="label">Decorrido</span>
                    <div id="disp-time-dec" class="time-value">00:00</div>
                </div>
                <div class="time-box">
                    <span class="label">Ajustado</span>
                    <div id="disp-time-set" class="time-value">00:00</div>
                </div>
            </div>
        </div>

        <!-- Card de Controles -->
        <div class="card">
            <span class="label">Configurar Corrente</span>
            <div class="input-group">
                <input type="number" id="input-i" step="0.1" min="0" max="20" placeholder="mA">
                <button class="btn btn-warning" style="width: auto; margin:0" onclick="sendSetpoint()">ENVIAR</button>
            </div>

            <div class="grid-2" style="margin-top: 20px;">
                <button class="btn btn-success" onclick="sendCommand('A')">INICIAR</button>
                <button class="btn btn-danger" onclick="sendCommand('B')">PARAR</button>
            </div>
        </div>
    </div>

    <script>
        // UUIDs idênticos ao seu código ESP32
        const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const CHARACTERISTIC_RX = "6e400002-b5a3-f393-e0a9-e50e24dcca9e"; // Escrita (Web -> ESP)
        const CHARACTERISTIC_TX = "6e400003-b5a3-f393-e0a9-e50e24dcca9e"; // Notificação (ESP -> Web)

        let device, rxChar;

        async function connectBLE() {
            try {
                console.log("Buscando dispositivo...");
                device = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'TechPain' }],
                    optionalServices: [SERVICE_UUID]
                });

                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                rxChar = await service.getCharacteristic(CHARACTERISTIC_RX);
                const txChar = await service.getCharacteristic(CHARACTERISTIC_TX);

                await txChar.startNotifications();
                txChar.addEventListener('characteristicvaluechanged', (event) => {
                    const str = new TextDecoder().decode(event.target.value);
                    parseData(str);
                });

                document.getElementById('connectBtn').innerText = "DISPOSITIVO PAREADO";
                document.getElementById('connectBtn').style.opacity = "0.6";
                
                device.addEventListener('gattserverdisconnected', () => {
                    document.getElementById('st-badge').innerText = "DESCONECTADO";
                    document.getElementById('st-badge').className = "badge badge-off";
                    document.getElementById('connectBtn').innerText = "CONECTAR DISPOSITIVO";
                });

            } catch (error) {
                console.error("Erro BLE:", error);
                alert("Falha na conexão. Verifique se o Bluetooth está ativo e use HTTPS/Bluefy.");
            }
        }

        function parseData(s) {
            // Protocolo: [A/B] I[Set] R[Real] T[TimeSet][TimeDec]
            // Ex: AI5.0R4.8T01:0000:05

            // 1. Status LIGA/DESLIGA
            const badge = document.getElementById('st-badge');
            if (s.startsWith('A')) {
                badge.innerText = "LIGADO";
                badge.className = "badge badge-on";
            } else {
                badge.innerText = "DESLIGADO";
                badge.className = "badge badge-off";
            }

            // 2. Corrente AJUSTADA (Captura o valor entre 'I' e 'R')
            const matchI = s.match(/I([\d.]+)/);
            if (matchI) {
                document.getElementById('disp-i-set').innerHTML = `${matchI[1]}<small style="font-size: 1.5rem">mA</small>`;
            }

            // 3. Tempos (Ajustado e Decorrido)
            // Regex procura por dois padrões de XX:XX após o T
            const matchT = s.match(/T(\d{2}:\d{2})(\d{2}:\d{2})/);
            if (matchT) {
                document.getElementById('disp-time-set').innerText = matchT[1];
                document.getElementById('disp-time-dec').innerText = matchT[2];
            }
        }

        async function sendCommand(cmd) {
            if (!rxChar) {
                alert("Conecte ao Bluetooth primeiro!");
                return;
            }
            try {
                const encoder = new TextEncoder();
                await rxChar.writeValue(encoder.encode(cmd));
            } catch (err) {
                console.error("Erro ao enviar:", err);
            }
        }

        function sendSetpoint() {
            const val = document.getElementById('input-i').value;
            if (val === "" || isNaN(val)) {
                alert("Insira um valor de corrente válido.");
                return;
            }
            // Envia no formato "I5.5" conforme o seu Arduino espera
            sendCommand('I' + val);
        }
    </script>
</body>
</html>
